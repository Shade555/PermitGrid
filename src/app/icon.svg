<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#061433"/>
      <stop offset="1" stop-color="#020817"/>
    </radialGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e6bff"/>
      <stop offset="1" stop-color="#0a2a9a"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051433"/>
      <stop offset="1" stop-color="#030b1f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ea8ff"/>
      <stop offset="0.6" stop-color="#0a72ff"/>
      <stop offset="1" stop-color="#2447ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19d8ff"/>
      <stop offset="1" stop-color="#0a70ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45f0a8"/>
      <stop offset="1" stop-color="#0aa8b8"/>
    </linearGradient>
    <linearGradient id="greenBig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dffb0"/>
      <stop offset="0.5" stop-color="#14d6a0"/>
      <stop offset="1" stop-color="#0a9aae"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a78ff"/>
      <stop offset="0.5" stop-color="#3a3cff"/>
      <stop offset="1" stop-color="#2447ff"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ff"/>
      <stop offset="1" stop-color="#1177ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1254" height="1254" fill="url(#bg)"/>

  <!-- Panel -->
  <rect x="115" y="115" width="1025" height="1006" rx="230" fill="none" stroke="#1450ff" stroke-opacity="0.5" stroke-width="16" filter="url(#softGlow)"/>
  <rect x="115" y="115" width="1025" height="1006" rx="230" fill="url(#panelFill)" stroke="url(#panelStroke)" stroke-width="3"/>

  <!-- Connectors -->
  <g fill="url(#link)">
    <rect x="410" y="322" width="135" height="28"/>
    <rect x="710" y="322" width="135" height="28"/>
    <rect x="410" y="868" width="135" height="28" />
    <rect x="710" y="868" width="135" height="28"/>
    <rect x="325" y="420" width="28" height="112"/>
    <rect x="902" y="420" width="28" height="112"/>
    <rect x="325" y="694" width="28" height="108"/>
    <rect x="902" y="694" width="28" height="108"/>
    <rect x="613" y="398" width="28" height="112" fill="#22e0ff"/>
    <rect x="613" y="716" width="28" height="106" fill="#22d3ff"/>
    <rect x="402" y="598" width="118" height="28" fill="#22e6ff"/>
    <rect x="734" y="598" width="115" height="28" fill="#22d3ff"/>
  </g>

  <!-- Nodes -->
  <g>
    <!-- Top-left -->
    <rect x="268" y="274" width="150" height="152" rx="42" fill="url(#blue)"/>
    <rect x="268" y="274" width="150" height="152" rx="42" fill="url(#shine)"/>
    <!-- Top-center -->
    <rect x="538" y="231" width="177" height="174" rx="52" fill="url(#cyan)"/>
    <!-- Top-right -->
    <rect x="836" y="274" width="150" height="152" rx="42" fill="url(#green)"/>
    <!-- Mid-left -->
    <rect x="233" y="526" width="176" height="174" rx="52" fill="url(#blue)"/>
    <rect x="233" y="526" width="176" height="174" rx="52" fill="url(#shine)"/>
    <!-- Mid-right -->
    <rect x="843" y="526" width="177" height="174" rx="52" fill="url(#blue)"/>
    <rect x="843" y="526" width="177" height="174" rx="52" fill="url(#shine)"/>
    <!-- Bottom-left -->
    <rect x="268" y="795" width="150" height="151" rx="42" fill="url(#green)"/>
    <!-- Bottom-center -->
    <rect x="538" y="816" width="177" height="169" rx="52" fill="url(#purple)"/>
    <rect x="538" y="816" width="177" height="169" rx="52" fill="url(#shine)"/>
    <!-- Bottom-right -->
    <rect x="836" y="795" width="150" height="151" rx="42" fill="url(#blue)"/>
  </g>

  <!-- Center node with check -->
  <g filter="url(#glow)">
    <rect x="514" y="505" width="227" height="216" rx="58" fill="url(#greenBig)"/>
  </g>
  <path d="M577 614 L609 646 L681 577" fill="none" stroke="#f4fffb" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
